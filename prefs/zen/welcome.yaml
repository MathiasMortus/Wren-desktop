# Wren: always true. Wren opens its own welcome page (resource://wren-welcome/)
# and never shows Zen's welcome wizard. Zen ties this to MOZILLA_OFFICIAL, which
# Wren now sets for every build; with Zen's value the wizard would start once on
# an existing profile.
- name: zen.welcome-screen.seen
  value: true
  sticky: true
